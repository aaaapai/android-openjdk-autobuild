name: Build OpenJDK26 for Android

on:
  workflow_dispatch:

jobs:
  build_android:
    strategy:
      matrix:
        arch: ["aarch64"]
      fail-fast: false

    name: "Build for Android ${{matrix.arch}}"
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@main
    - name: set up JDK 25
      uses: actions/setup-java@main
      with:
        java-version: '25-ea'
        distribution: 'adopt-openj9'
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt -y install systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev
        git clone --depth 1 --branch buildjre26-test https://github.com/aaaapai/android-openjdk-build

    - name: Build with CI build script
      env:
        EEEE: "https://github.com/ibmruntimes/openj9-openjdk-jdk"
      run: |
        cd android-openjdk-build
        bash "ci_build_arch_${{matrix.arch}}.sh"

    - name: Upload JDK build output
      uses: actions/upload-artifact@main
      with:
        name: "jdk25-${{matrix.arch}}"
        path: android-openjdk-build/jdk26*.tar.xz
        
    - name: Upload JRE build output
      uses: actions/upload-artifact@main
      with:
        name: 'jre25-${{matrix.arch}}'
        path: android-openjdk-build/jre26*.tar.xz
        
    - name: Upload JRE debuginfo build output
      uses: actions/upload-artifact@main
      with:
        name: "jre26-debuginfo-${{matrix.arch}}"
        path: android-openjdk-build/dizout
        
    - name: Upload jspawnhelper lib output
      if: ${{ matrix.arch == 'aarch64'}}
      uses: actions/upload-artifact@main
      with:
        name: jsph-26
        path: android-openjdk-build/libjsph26.so
